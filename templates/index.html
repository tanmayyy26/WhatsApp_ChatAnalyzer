<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Analyzer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .upload-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .file-input-label:hover {
            transform: translateY(-2px);
        }
        
        .file-name {
            display: block;
            margin-top: 15px;
            color: #666;
        }
        
        .analyze-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        
        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results-section {
            display: none;
        }
        
        .results-section.show {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card .label {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }
        
        .chart-container {
            height: 400px;
            margin: 20px 0;
        }
        
        .error-message, .success-message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }
        
        .success-message {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
        
        .error-message.show, .success-message.show {
            display: block;
        }
        
        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💬 WhatsApp Chat Analyzer</h1>
            <p>Upload your WhatsApp chat export to discover insights! ✨</p>
        </header>
        
        <div class="upload-section">
            <h2 style="margin-bottom: 20px; color: #333;">📤 Upload Your Chat File</h2>
            
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".txt" />
                <label for="fileInput" class="file-input-label">📁 Choose File</label>
                <span class="file-name" id="fileName">No file selected</span>
            </div>
            
            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeChat()" disabled>
                🚀 Analyze Chat
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing your chat...</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div class="stats-grid" id="statsGrid"></div>
            
            <div class="section">
                <h2>👥 Top Contributors</h2>
                <div id="topSendersChart" class="chart-container"></div>
            </div>
            
            <div class="section">
                <h2>🔤 Top Words</h2>
                <div id="wordsChart" class="chart-container"></div>
            </div>
            
            <div class="section">
                <h2>📅 Activity Patterns</h2>
                <div id="dailyActivityChart" class="chart-container"></div>
            </div>
        </div>
        
        <footer>
            <p>Made with ❤️ using Flask | WhatsApp Analyzer v2.0</p>
        </footer>
    </div>
    
    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || 'No file selected';
            document.getElementById('fileName').textContent = fileName;
            document.getElementById('analyzeBtn').disabled = !e.target.files[0];
        });
        
        async function analyzeChat() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('Please select a file first');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Analysis failed');
                }
                
                displayResults(data);
                
                document.getElementById('successMessage').textContent = '✅ Analysis complete!';
                document.getElementById('successMessage').classList.add('show');
                
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
        }
        
        function displayResults(data) {
            // Stats Cards
            const stats = data.basic_stats;
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="label">💬 Total Messages</div>
                    <div class="value">${stats.total_messages.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="label">👥 Participants</div>
                    <div class="value">${stats.participants}</div>
                </div>
                <div class="stat-card">
                    <div class="label">📅 Duration (Days)</div>
                    <div class="value">${stats.duration_days}</div>
                </div>
                <div class="stat-card">
                    <div class="label">📈 Avg Messages/Day</div>
                    <div class="value">${stats.avg_messages_per_day.toFixed(1)}</div>
                </div>
            `;
            
            // Top Senders
            const senders = data.top_senders.map(s => s.sender);
            const messages = data.top_senders.map(s => s.messages);
            
            Plotly.newPlot('topSendersChart', [{
                x: messages,
                y: senders,
                type: 'bar',
                orientation: 'h',
                marker: { color: '#667eea' }
            }], {
                margin: { l: 150 },
                title: 'Messages by Sender'
            });
            
            // Top Words
            const words = data.top_words.map(w => w.word);
            const frequencies = data.top_words.map(w => w.frequency);
            
            Plotly.newPlot('wordsChart', [{
                x: words,
                y: frequencies,
                type: 'bar',
                marker: { color: '#764ba2' }
            }], {
                title: 'Most Frequently Used Words'
            });
            
            // Daily Activity
            const dates = data.daily_activity.map(d => d.date);
            const counts = data.daily_activity.map(d => d.messages);
            
            Plotly.newPlot('dailyActivityChart', [{
                x: dates,
                y: counts,
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: '#667eea' }
            }], {
                title: 'Messages per Day'
            });
            
            document.getElementById('resultsSection').classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
